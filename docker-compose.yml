services:
  ai-service:
    build: .
    image: image-extractor
    ports:
      - "8088:8088"
      - "5678:5678"

    networks:
      - panfleteiro-network

    command: >
      uv run python
        -Xfrozen_modules=off
        -m debugpy
        --listen 0.0.0.0:5678
        -m uvicorn app.main:app
        --host 0.0.0.0
        --port 8000

    volumes:
      - ./credentials:/credentials
    environment:
      # Google
     GOOGLE_DRIVE_APPLICATION_NAME: Mercadao
     GOOGLE_CREDENTIALS_PATH: /credentials/drive-service-account.json
     GOOGLE_DRIVE_MAIN_DIRECTORY: ${GOOGLE_DRIVE_MAIN_DIRECTORY}
     GOOGLE_DRIVE_PROCESSED_DIRECTORY: ${GOOGLE_DRIVE_PROCESSED_DIRECTORY}

     # AI
     OPENAI_API_KEY: ${OPENAI_API_KEY}

     # Database
     DATABASE_USER: ${DATABASE_USER}
     DATABASE_PASSWORD: ${DATABASE_PASSWORD}
     DATABASE_HOST: ${DATABASE_HOST}
     DATABASE_PORT: ${DATABASE_PORT}
     DATABASE_NAME: ${DATABASE_NAME}

networks:
  panfleteiro-network:
    external: true